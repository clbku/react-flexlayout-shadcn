name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Validate build output
        run: |
          for file in dist/index.js dist/index.d.ts dist/index.css; do
            if [ ! -f "$file" ]; then
              echo "::error::Expected build artifact '$file' is missing"
              exit 1
            fi
          done
          echo "Build validation passed"
