name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check if version is releasable
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version in package.json: $VERSION"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::warning::Tag v$VERSION already exists. Skipping release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "react-flexlayout-shadcn@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::Version $VERSION is already published on npm. Skipping release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should-release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Validate build output
        run: |
          for file in dist/index.js dist/index.d.ts dist/index.css; do
            if [ ! -f "$file" ]; then
              echo "::error::Expected build artifact '$file' is missing"
              exit 1
            fi
          done
          echo "Build validation passed"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create release tag
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true

      - name: Merge release into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          git fetch origin main
          git checkout main
          git merge --no-ff origin/release -m "chore: merge release v$VERSION into main"
          git push origin main
